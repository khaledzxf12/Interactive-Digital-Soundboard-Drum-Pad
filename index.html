<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundboard & Drum Pad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Interactive Soundboard</h1>
            <p>أضغط علي الازرار الموضحة بإستخدام الماوس</p>
        </header>

        <div class="pad-grid">
            <button class="pad-btn color-1" data-key="A" data-sound="https://cdn.freesound.org/samples/387/387186-22a84d41-efbf-49f2-8418-2e061dd66c30.mp3">
                <span class="sound-name">Kick</span>
                <span class="key-hint">A</span>
            </button>

            <button class="pad-btn color-2" data-key="S" data-sound="https://cdn.freesound.org/samples/387/387187-3e3d64e8-8a8f-4b07-93d3-92f7685a498b.mp3">
                <span class="sound-name">Snare</span>
                <span class="key-hint">S</span>
            </button>

            <button class="pad-btn color-3" data-key="D" data-sound="https://cdn.freesound.org/samples/387/387185-98544929-28a1-432a-bc9d-b4f009e4f555.mp3">
                <span class="sound-name">Hi-Hat</span>
                <span class="key-hint">D</span>
            </button>

            <button class="pad-btn color-4" data-key="F" data-sound="https://cdn.freesound.org/samples/48/48310-a2bd3c8c-687f-4b53-86a0-438676bf0338.mp3">
                <span class="sound-name">Clap</span>
                <span class="key-hint">F</span>
            </button>

            <button class="pad-btn color-5" data-key="J" data-sound="https://cdn.freesound.org/samples/33/33637-8f5eb65d-6f29-4dfd-b49b-7347a3f3a8b4.mp3">
                <span class="sound-name">Tom</span>
                <span class="key-hint">J</span>
            </button>

            <button class="pad-btn color-6" data-key="K" data-sound="https://cdn.freesound.org/samples/523/523422-b5e1a141-8f55-46f0-b21a-47c3e1e83df3.mp3">
                <span class="sound-name">Crash</span>
                <span class="key-hint">K</span>
            </button>

            <button class="pad-btn color-7" data-key="L" data-sound="https://cdn.freesound.org/samples/274/274836-8488e0cb-419b-4e6f-a8eb-48598444a169.mp3">
                <span class="sound-name">Bell</span>
                <span class="key-hint">L</span>
            </button>

            <button class="pad-btn color-8" data-key=";" data-sound="https://cdn.freesound.org/samples/256/256113-57934440-2795-4663-8884-6e69123e4d92.mp3">
                <span class="sound-name">Laser</span>
                <span class="key-hint">;</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
